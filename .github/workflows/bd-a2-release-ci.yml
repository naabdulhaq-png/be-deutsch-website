name: BD A2 canonical Linux reproducibility

on:
  push:
    branches:
      - review/bd-a2-release-ci-01

permissions:
  contents: read

concurrency:
  group: bd-a2-canonical-linux-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: 22.23.4
  PNPM_VERSION: 11.25.0
  TZ: UTC
  LANG: C.UTF-8
  LC_ALL: C.UTF-8
  NODE_ENV: production
  SOURCE_DATE_EPOCH: "0"

jobs:
  canonical-two-build:
    if: github.ref == 'refs/heads/review/bd-a2-release-ci-01'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out the exact review commit without retained credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
          persist-credentials: false
          path: source

      - name: Install pinned pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.25.0
          run_install: false

      - name: Install pinned Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.4

      - name: Verify event, commit, runner and toolchain
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/review/bd-a2-release-ci-01"
          test "$(git -C source rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(node --version)" = "v${NODE_VERSION}"
          test "$(pnpm --version)" = "${PNPM_VERSION}"
          test "$RUNNER_OS" = "Linux"
          uname -a
          node --version
          pnpm --version

      - name: Create two independent clean source workspaces
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_ARCHIVE="$RUNNER_TEMP/bd-a2-source.tar"
          tar \
            --exclude=.git \
            --exclude=node_modules \
            --exclude=dist \
            --exclude=release-dist \
            --exclude=.astro \
            --sort=name \
            --mtime='@0' \
            --owner=0 \
            --group=0 \
            --numeric-owner \
            -C "$GITHUB_WORKSPACE/source" \
            -cf "$SOURCE_ARCHIVE" .
          mkdir -p "$RUNNER_TEMP/build-a" "$RUNNER_TEMP/build-b" "$RUNNER_TEMP/evidence"
          tar -xf "$SOURCE_ARCHIVE" -C "$RUNNER_TEMP/build-a"
          tar -xf "$SOURCE_ARCHIVE" -C "$RUNNER_TEMP/build-b"
          (
            cd "$RUNNER_TEMP/build-a"
            find . -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum
          ) > "$RUNNER_TEMP/evidence/source-a.sha256"
          (
            cd "$RUNNER_TEMP/build-b"
            find . -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum
          ) > "$RUNNER_TEMP/evidence/source-b.sha256"
          diff -u "$RUNNER_TEMP/evidence/source-a.sha256" "$RUNNER_TEMP/evidence/source-b.sha256"
          sha256sum "$RUNNER_TEMP/evidence/source-a.sha256"

      - name: Clean install and validate Build A
        shell: bash
        working-directory: ${{ runner.temp }}/build-a/07_Website
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile --store-dir "$RUNNER_TEMP/pnpm-store-a"
          pnpm audit --audit-level low
          node --input-type=module -e "import sharp from 'sharp'; console.log(JSON.stringify(sharp.versions, null, 2))" > "$RUNNER_TEMP/evidence/sharp-a.json"
          node ../ci-tools/prepare-ui08-baseline-fixture.mjs
          mkdir -p ../manifests
          pnpm build:release-candidate
          node --experimental-strip-types --test tests/a2-release.test.ts
          node ../ci-tools/check-a2-reachability.mjs \
            --site ../release-dist \
            --inventory ../ci-tools/a2-reachability-inventory.json \
            --output "$RUNNER_TEMP/evidence/reachability-a.json"
          pnpm list --depth Infinity --json \
            | sed "s#${RUNNER_TEMP}/build-a#BUILD_ROOT#g" \
            > "$RUNNER_TEMP/evidence/dependencies-a.json"

      - name: Clean install and validate Build B
        shell: bash
        working-directory: ${{ runner.temp }}/build-b/07_Website
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile --store-dir "$RUNNER_TEMP/pnpm-store-b"
          node --input-type=module -e "import sharp from 'sharp'; console.log(JSON.stringify(sharp.versions, null, 2))" > "$RUNNER_TEMP/evidence/sharp-b.json"
          node ../ci-tools/prepare-ui08-baseline-fixture.mjs
          mkdir -p ../manifests
          pnpm build:release-candidate
          node --experimental-strip-types --test tests/a2-release.test.ts
          node ../ci-tools/check-a2-reachability.mjs \
            --site ../release-dist \
            --inventory ../ci-tools/a2-reachability-inventory.json \
            --output "$RUNNER_TEMP/evidence/reachability-b.json"
          pnpm list --depth Infinity --json \
            | sed "s#${RUNNER_TEMP}/build-b#BUILD_ROOT#g" \
            > "$RUNNER_TEMP/evidence/dependencies-b.json"

      - name: Verify identical dependency and native-image resolution
        shell: bash
        run: |
          set -euo pipefail
          diff -u "$RUNNER_TEMP/evidence/sharp-a.json" "$RUNNER_TEMP/evidence/sharp-b.json"
          diff -u "$RUNNER_TEMP/evidence/dependencies-a.json" "$RUNNER_TEMP/evidence/dependencies-b.json"
          diff -u "$RUNNER_TEMP/evidence/reachability-a.json" "$RUNNER_TEMP/evidence/reachability-b.json"

      - name: Strictly compare complete Build A and Build B artifacts
        id: strict_comparison
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          ARTIFACT_A="$RUNNER_TEMP/build-a/release-dist"
          ARTIFACT_B="$RUNNER_TEMP/build-b/release-dist"
          test -d "$ARTIFACT_A"
          test -d "$ARTIFACT_B"
          (
            cd "$ARTIFACT_A"
            find . -type f -printf '%P\n' | LC_ALL=C sort
          ) > "$RUNNER_TEMP/evidence/files-a.txt"
          (
            cd "$ARTIFACT_B"
            find . -type f -printf '%P\n' | LC_ALL=C sort
          ) > "$RUNNER_TEMP/evidence/files-b.txt"
          (
            cd "$ARTIFACT_A"
            find . -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum
          ) > "$RUNNER_TEMP/evidence/build-a.sha256"
          (
            cd "$ARTIFACT_B"
            find . -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum
          ) > "$RUNNER_TEMP/evidence/build-b.sha256"

          FILES_A="$(wc -l < "$RUNNER_TEMP/evidence/files-a.txt" | tr -d ' ')"
          FILES_B="$(wc -l < "$RUNNER_TEMP/evidence/files-b.txt" | tr -d ' ')"
          HTML="$(find "$ARTIFACT_A" -type f -name '*.html' | wc -l | tr -d ' ')"
          AUDIO="$(find "$ARTIFACT_A/a2-expanded-audio" -type f -iname '*.mp3' | wc -l | tr -d ' ')"
          SITEMAP="$(grep -o '<loc>' "$ARTIFACT_A/sitemap-0.xml" | wc -l | tr -d ' ')"
          MISSING_PATHS="$(comm -23 "$RUNNER_TEMP/evidence/files-a.txt" "$RUNNER_TEMP/evidence/files-b.txt" | wc -l | tr -d ' ')"
          EXTRA_PATHS="$(comm -13 "$RUNNER_TEMP/evidence/files-a.txt" "$RUNNER_TEMP/evidence/files-b.txt" | wc -l | tr -d ' ')"
          if diff -u "$RUNNER_TEMP/evidence/build-a.sha256" "$RUNNER_TEMP/evidence/build-b.sha256" > "$RUNNER_TEMP/evidence/hash-diff.txt"; then
            DIFFERING_HASHES=0
          else
            DIFFERING_HASHES="$({ diff --old-group-format='%<' --new-group-format='' --unchanged-group-format='' "$RUNNER_TEMP/evidence/build-a.sha256" "$RUNNER_TEMP/evidence/build-b.sha256" || true; } | wc -l | tr -d ' ')"
          fi

          printf 'Artifact metrics: files_a=%s files_b=%s html=%s sitemap=%s audio=%s missing_paths=%s extra_paths=%s differing_hashes=%s\n' \
            "$FILES_A" "$FILES_B" "$HTML" "$SITEMAP" "$AUDIO" "$MISSING_PATHS" "$EXTRA_PATHS" "$DIFFERING_HASHES"

          test "$FILES_A" = "3054"
          test "$FILES_B" = "3054"
          test "$HTML" = "240"
          test "$AUDIO" = "59"
          test "$SITEMAP" = "238"
          test "$MISSING_PATHS" = "0"
          test "$EXTRA_PATHS" = "0"
          test "$DIFFERING_HASHES" = "0"
          diff -u "$RUNNER_TEMP/evidence/files-a.txt" "$RUNNER_TEMP/evidence/files-b.txt"
          diff -u "$RUNNER_TEMP/evidence/build-a.sha256" "$RUNNER_TEMP/evidence/build-b.sha256"
          test ! -e "$ARTIFACT_A/a2/audio-review/index.html"
          test ! -e "$ARTIFACT_A/a2/review-index/index.html"
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';

          const reportPath = `${process.env.RUNNER_TEMP}/evidence/reachability-a.json`;
          let report;
          try {
            report = JSON.parse(readFileSync(reportPath, 'utf8'));
          } catch (error) {
            console.error(`Reachability report is not valid JSON: ${error.message}`);
            process.exit(1);
          }

          const expectedCounts = {
            vocabulary_record: 300,
            grammar_topic: 40,
            activity: 384,
            listening_passage: 24,
            listening_question: 72,
            podcast_episode: 5,
            podcast_chapter: 30,
            podcast_question: 30
          };
          const failures = [];
          if (!report || typeof report !== 'object' || Array.isArray(report)) failures.push('root must be an object');
          if (report?.schemaVersion !== '1.0.0') failures.push('schemaVersion must equal 1.0.0');
          if (report?.status !== 'PASS') failures.push('status must equal PASS');
          if (typeof report?.sourceInventorySha256 !== 'string' || !/^[a-f0-9]{64}$/i.test(report.sourceInventorySha256)) failures.push('sourceInventorySha256 must be a 64-character hexadecimal SHA-256');
          for (const [field, expected] of Object.entries({
            expectedRecords: 885,
            presentedRecords: 885,
            reachableRecords: 885,
            reachableRoutes: 238,
            publicHtmlPages: 240,
            unitsReachable: 10
          })) {
            if (typeof report?.[field] !== 'number' || !Number.isInteger(report[field])) failures.push(`${field} must be an integer`);
            else if (report[field] !== expected) failures.push(`${field} must equal ${expected}, received ${report[field]}`);
          }
          if (!Array.isArray(report?.failures)) failures.push('failures must be an array');
          else if (report.failures.length !== 0) failures.push(`failures must contain zero entries, received ${report.failures.length}`);
          if (!report?.counts || typeof report.counts !== 'object' || Array.isArray(report.counts)) failures.push('counts must be an object');
          else {
            for (const [field, expected] of Object.entries(expectedCounts)) {
              if (typeof report.counts[field] !== 'number' || !Number.isInteger(report.counts[field])) failures.push(`counts.${field} must be an integer`);
              else if (report.counts[field] !== expected) failures.push(`counts.${field} must equal ${expected}, received ${report.counts[field]}`);
            }
          }
          if (failures.length) {
            console.error(`Reachability assertion failed:\n- ${failures.join('\n- ')}`);
            process.exit(1);
          }
          console.log('Reachability schema and contract: PASS (885/885 records, 10/10 units, zero failures).');
          NODE

          MANIFEST_SHA="$(sha256sum "$RUNNER_TEMP/evidence/build-a.sha256" | cut -d' ' -f1)"
          printf '{"status":"PASS","sourceCommit":"%s","runnerOS":"%s","node":"%s","pnpm":"%s","filesA":%s,"filesB":%s,"htmlPages":%s,"sitemapEntries":%s,"audioAssets":%s,"missingPaths":%s,"extraPaths":%s,"differingHashes":%s,"manifestSha256":"%s","exactPathAndHashEquality":true}\n' \
            "$GITHUB_SHA" "$RUNNER_OS" "$(node --version)" "$(pnpm --version)" "$FILES_A" "$FILES_B" "$HTML" "$SITEMAP" "$AUDIO" "$MISSING_PATHS" "$EXTRA_PATHS" "$DIFFERING_HASHES" "$MANIFEST_SHA" \
            | tee "$RUNNER_TEMP/evidence/STRICT_TWO_BUILD_COMPARISON.json"

          {
            echo '## Canonical Linux reproducibility'
            echo
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Toolchain: \`$RUNNER_OS / $(node --version) / pnpm $(pnpm --version)\`"
            echo "- Build A files: \`$FILES_A\`"
            echo "- Build B files: \`$FILES_B\`"
            echo "- Public HTML: \`$HTML\`"
            echo "- Sitemap entries: \`$SITEMAP\`"
            echo "- Audio assets: \`$AUDIO\`"
            echo "- Missing paths: \`$MISSING_PATHS\`"
            echo "- Extra paths: \`$EXTRA_PATHS\`"
            echo "- Differing hashes: \`$DIFFERING_HASHES\`"
            echo '- Approved A2 records reachable: `885/885`'
            echo "- Canonical manifest SHA-256: \`$MANIFEST_SHA\`"
            echo '- Build A vs Build B: **exact path and SHA-256 equality PASS**'
          } >> "$GITHUB_STEP_SUMMARY"

          # Preserve the complete canonical checksum list in the non-deployment job log.
          echo 'BEGIN_CANONICAL_ARTIFACT_SHA256_MANIFEST'
          cat "$RUNNER_TEMP/evidence/build-a.sha256"
          echo 'END_CANONICAL_ARTIFACT_SHA256_MANIFEST'

      - name: Browser-validate learner journeys, media and all-unit navigation
        id: browser_validation
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          ARTIFACT_A="$RUNNER_TEMP/build-a/release-dist"
          SERVER_HOST="127.0.0.1"
          SERVER_PORT="4173"
          CDP_HOST="127.0.0.1"
          CDP_PORT="9222"
          SERVER_LOG="$RUNNER_TEMP/evidence/http-server.log"
          CHROME_LOG="$RUNNER_TEMP/evidence/chrome.log"
          SERVER_PID=""
          CHROME_PID=""

          cleanup() {
            if [ -n "$CHROME_PID" ]; then kill "$CHROME_PID" 2>/dev/null || true; fi
            if [ -n "$SERVER_PID" ]; then kill "$SERVER_PID" 2>/dev/null || true; fi
          }
          diagnostics() {
            echo '--- browser harness diagnostics ---'
            if [ -n "$SERVER_PID" ]; then ps -p "$SERVER_PID" -o pid=,stat=,cmd= || true; fi
            if [ -n "$CHROME_PID" ]; then ps -p "$CHROME_PID" -o pid=,stat=,cmd= || true; fi
            echo '--- http-server.log ---'
            test -f "$SERVER_LOG" && cat "$SERVER_LOG" || true
            echo '--- chrome.log ---'
            test -f "$CHROME_LOG" && cat "$CHROME_LOG" || true
            echo '--- end diagnostics ---'
          }
          finish() {
            status=$?
            trap - EXIT
            if [ "$status" -ne 0 ]; then diagnostics; fi
            cleanup
            exit "$status"
          }
          trap finish EXIT

          test -d "$ARTIFACT_A"
          CHROME_BIN=""
          for candidate in google-chrome google-chrome-stable chromium chromium-browser; do
            if command -v "$candidate" >/dev/null 2>&1; then
              CHROME_BIN="$(command -v "$candidate")"
              break
            fi
          done
          test -n "$CHROME_BIN"
          echo "Chrome binary: $CHROME_BIN"

          cat > "$RUNNER_TEMP/evidence/range-server.mjs" <<'NODE_SERVER'
          import { createReadStream, statSync } from 'node:fs';
          import { createServer } from 'node:http';
          import { extname, join, normalize, resolve, sep } from 'node:path';

          const root = resolve(process.argv[2]);
          const host = process.argv[3];
          const port = Number(process.argv[4]);
          const mime = {
            '.avif': 'image/avif', '.css': 'text/css; charset=utf-8', '.html': 'text/html; charset=utf-8',
            '.jpeg': 'image/jpeg', '.jpg': 'image/jpeg', '.js': 'text/javascript; charset=utf-8',
            '.json': 'application/json; charset=utf-8', '.mp3': 'audio/mpeg', '.png': 'image/png',
            '.svg': 'image/svg+xml', '.txt': 'text/plain; charset=utf-8', '.xml': 'application/xml; charset=utf-8'
          };
          const server = createServer((request, response) => {
            try {
              const pathname = decodeURIComponent(new URL(request.url, `http://${host}`).pathname);
              const relative = normalize(pathname).replace(/^([/\\])+/, '');
              let file = resolve(join(root, relative));
              if (file !== root && !file.startsWith(`${root}${sep}`)) throw new Error('Path outside root');
              let stat = statSync(file);
              if (stat.isDirectory()) { file = join(file, 'index.html'); stat = statSync(file); }
              if (!stat.isFile()) throw new Error('Not a file');
              const headers = { 'Accept-Ranges': 'bytes', 'Content-Type': mime[extname(file).toLowerCase()] ?? 'application/octet-stream' };
              const range = request.headers.range?.match(/^bytes=(\d*)-(\d*)$/);
              if (range) {
                const start = range[1] ? Number(range[1]) : 0;
                const end = range[2] ? Math.min(Number(range[2]), stat.size - 1) : stat.size - 1;
                if (!Number.isInteger(start) || !Number.isInteger(end) || start < 0 || start > end || start >= stat.size) {
                  response.writeHead(416, { ...headers, 'Content-Range': `bytes */${stat.size}` });
                  response.end();
                  return;
                }
                response.writeHead(206, { ...headers, 'Content-Length': end - start + 1, 'Content-Range': `bytes ${start}-${end}/${stat.size}` });
                if (request.method === 'HEAD') response.end();
                else createReadStream(file, { start, end }).pipe(response);
                return;
              }
              response.writeHead(200, { ...headers, 'Content-Length': stat.size });
              if (request.method === 'HEAD') response.end();
              else createReadStream(file).pipe(response);
            } catch {
              response.writeHead(404, { 'Content-Type': 'text/plain; charset=utf-8' });
              response.end('Not found');
            }
          });
          server.listen(port, host, () => console.log(`Range server listening on http://${host}:${port}`));
          NODE_SERVER

          node "$RUNNER_TEMP/evidence/range-server.mjs" "$ARTIFACT_A" "$SERVER_HOST" "$SERVER_PORT" \
            > "$SERVER_LOG" 2>&1 &
          SERVER_PID=$!
          SERVER_READY=0
          for attempt in $(seq 1 60); do
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              echo 'Static server exited before becoming ready.' >&2
              exit 1
            fi
            if curl --noproxy '*' --ipv4 --fail --silent --show-error --max-time 2 \
              "http://${SERVER_HOST}:${SERVER_PORT}/a2/" > /dev/null; then
              SERVER_READY=1
              break
            fi
            sleep 0.25
          done
          if [ "$SERVER_READY" -ne 1 ]; then
            echo 'Static server readiness timed out.' >&2
            exit 1
          fi
          echo "Static server ready: http://${SERVER_HOST}:${SERVER_PORT}/a2/"

          "$CHROME_BIN" \
            --headless \
            --no-sandbox \
            --disable-gpu \
            --disable-dev-shm-usage \
            --no-first-run \
            --no-default-browser-check \
            --autoplay-policy=no-user-gesture-required \
            --remote-allow-origins='*' \
            --remote-debugging-address="$CDP_HOST" \
            --remote-debugging-port="$CDP_PORT" \
            --user-data-dir="$RUNNER_TEMP/chrome-a" \
            about:blank > "$CHROME_LOG" 2>&1 &
          CHROME_PID=$!
          CDP_READY=0
          for attempt in $(seq 1 120); do
            if ! kill -0 "$CHROME_PID" 2>/dev/null; then
              echo 'Chrome exited before the DevTools endpoint became ready.' >&2
              exit 1
            fi
            if curl --noproxy '*' --ipv4 --fail --silent --show-error --max-time 2 \
              "http://${CDP_HOST}:${CDP_PORT}/json/version" \
              > "$RUNNER_TEMP/evidence/cdp-version.json"; then
              CDP_READY=1
              break
            fi
            sleep 0.25
          done
          if [ "$CDP_READY" -ne 1 ]; then
            echo 'Chrome DevTools readiness timed out.' >&2
            exit 1
          fi
          echo "Chrome DevTools ready: http://${CDP_HOST}:${CDP_PORT}/json/version"
          cat "$RUNNER_TEMP/evidence/cdp-version.json"

          node source/ci-tools/check-a2-browser-reachability.mjs \
            --site "http://${SERVER_HOST}:${SERVER_PORT}" \
            --browser "http://${CDP_HOST}:${CDP_PORT}" \
            --output "$RUNNER_TEMP/evidence/browser-reachability.json"
          CDP_ENDPOINT="http://${CDP_HOST}:${CDP_PORT}" \
          SITE_ENDPOINT="http://${SERVER_HOST}:${SERVER_PORT}" \
          BROWSER_REPORT="$RUNNER_TEMP/evidence/browser-reachability.json" \
          node --input-type=module <<'NODE_KEYBOARD'
          import { readFileSync, writeFileSync } from 'node:fs';

          const wait = (milliseconds) => new Promise((resolve) => setTimeout(resolve, milliseconds));
          const target = await fetch(`${process.env.CDP_ENDPOINT}/json/new?about:blank`, { method: 'PUT' }).then((response) => response.json());
          const socket = new WebSocket(target.webSocketDebuggerUrl);
          await new Promise((resolve, reject) => {
            socket.addEventListener('open', resolve, { once: true });
            socket.addEventListener('error', reject, { once: true });
          });
          let messageId = 0;
          const pending = new Map();
          socket.addEventListener('message', (event) => {
            const message = JSON.parse(event.data);
            if (!message.id || !pending.has(message.id)) return;
            const task = pending.get(message.id);
            pending.delete(message.id);
            message.error ? task.reject(new Error(message.error.message)) : task.resolve(message.result);
          });
          const cdp = (method, params = {}) => new Promise((resolve, reject) => {
            const id = ++messageId;
            pending.set(id, { resolve, reject });
            socket.send(JSON.stringify({ id, method, params }));
          });
          const evaluate = async (expression) => {
            const response = await cdp('Runtime.evaluate', { expression, awaitPromise: true, returnByValue: true });
            if (response.exceptionDetails) throw new Error(response.exceptionDetails.exception?.description ?? response.exceptionDetails.text);
            return response.result.value;
          };
          await cdp('Page.enable');
          await cdp('Runtime.enable');
          await cdp('Page.navigate', { url: `${process.env.SITE_ENDPOINT}/a2/` });
          for (let attempt = 0; attempt < 40; attempt += 1) {
            await wait(100);
            if (await evaluate('document.readyState === "complete"')) break;
          }
          await cdp('Input.dispatchKeyEvent', { type: 'rawKeyDown', key: 'Tab', code: 'Tab', windowsVirtualKeyCode: 9, nativeVirtualKeyCode: 9 });
          await cdp('Input.dispatchKeyEvent', { type: 'keyUp', key: 'Tab', code: 'Tab', windowsVirtualKeyCode: 9, nativeVirtualKeyCode: 9 });
          await wait(100);
          const evidence = await evaluate(`(()=>{const node=document.activeElement;const rect=node?.getBoundingClientRect();return {tag:node?.tagName,href:node?.getAttribute?.('href'),className:String(node?.className??''),focusVisible:Boolean(node?.matches?.(':focus-visible')),visible:Boolean(rect&&rect.width>0&&rect.height>0)}})()`);
          const pass = ['A', 'BUTTON', 'INPUT', 'SELECT', 'TEXTAREA'].includes(evidence.tag) && evidence.focusVisible && evidence.visible;
          const report = JSON.parse(readFileSync(process.env.BROWSER_REPORT, 'utf8'));
          report.checks.push({ name: 'Keyboard Tab reaches a visible focusable learner control', pass, evidence });
          report.total = report.checks.length;
          report.passed = report.checks.filter((check) => check.pass).length;
          report.failed = report.checks.filter((check) => !check.pass).length;
          report.status = report.failed === 0 ? 'PASS' : 'FAIL';
          writeFileSync(process.env.BROWSER_REPORT, `${JSON.stringify(report, null, 2)}\n`);
          socket.close();
          NODE_KEYBOARD
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';

          const reportPath = `${process.env.RUNNER_TEMP}/evidence/browser-reachability.json`;
          let report;
          try {
            report = JSON.parse(readFileSync(reportPath, 'utf8'));
          } catch (error) {
            console.error(`Browser report is not valid JSON: ${error.message}`);
            process.exit(1);
          }

          const failures = [];
          if (!report || typeof report !== 'object' || Array.isArray(report)) failures.push('root must be an object');
          if (report?.schemaVersion !== '1.0.0') failures.push('schemaVersion must equal 1.0.0');
          if (report?.status !== 'PASS') failures.push('status must equal PASS');
          for (const [field, expected] of Object.entries({ total: 17, passed: 17, failed: 0 })) {
            if (typeof report?.[field] !== 'number' || !Number.isInteger(report[field])) failures.push(`${field} must be an integer`);
            else if (report[field] !== expected) failures.push(`${field} must equal ${expected}, received ${report[field]}`);
          }
          if (!Array.isArray(report?.checks)) failures.push('checks must be an array');
          else {
            if (report.checks.length !== 17) failures.push(`checks must contain 17 entries, received ${report.checks.length}`);
            report.checks.forEach((check, index) => {
              if (!check || typeof check !== 'object' || Array.isArray(check)) failures.push(`checks[${index}] must be an object`);
              else {
                if (typeof check.name !== 'string' || check.name.length === 0) failures.push(`checks[${index}].name must be a non-empty string`);
                if (check.pass !== true) failures.push(`checks[${index}].pass must equal true`);
              }
            });
          }
          if (failures.length) {
            console.error(`Browser assertion failed:\n- ${failures.join('\n- ')}`);
            process.exit(1);
          }
          console.log('Browser report schema and contract: PASS (17/17 checks, zero failures).');
          NODE
          {
            echo '## Browser learner validation'
            echo
            echo '- Browser harness readiness: **PASS**'
            echo '- Learner navigation, languages, RTL, mobile, exercises and media: **PASS**'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Enforce strict comparison and browser validation outcomes
        if: ${{ always() }}
        shell: bash
        env:
          STRICT_COMPARISON_OUTCOME: ${{ steps.strict_comparison.outcome }}
          BROWSER_VALIDATION_OUTCOME: ${{ steps.browser_validation.outcome }}
        run: |
          set -euo pipefail
          printf 'Independent gate outcomes: strict_comparison=%s browser_validation=%s\n' \
            "$STRICT_COMPARISON_OUTCOME" "$BROWSER_VALIDATION_OUTCOME"
          test "$STRICT_COMPARISON_OUTCOME" = "success"
          test "$BROWSER_VALIDATION_OUTCOME" = "success"
          echo 'Review-only build and validation complete. No artifact upload, Pages deployment, release, tag, merge, or hosting action was invoked.'
