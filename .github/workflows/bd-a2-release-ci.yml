name: BD A2 canonical Linux reproducibility

on:
  push:
    branches:
      - review/bd-a2-release-ci-01

permissions:
  contents: read

concurrency:
  group: bd-a2-canonical-linux-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: 22.23.4
  PNPM_VERSION: 11.25.0
  TZ: UTC
  LANG: C.UTF-8
  LC_ALL: C.UTF-8
  NODE_ENV: production
  SOURCE_DATE_EPOCH: "0"

jobs:
  canonical-two-build:
    if: github.ref == 'refs/heads/review/bd-a2-release-ci-01'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out the exact review commit without retained credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
          persist-credentials: false
          path: source

      - name: Install pinned pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.25.0
          run_install: false

      - name: Install pinned Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.4

      - name: Verify event, commit, runner and toolchain
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/review/bd-a2-release-ci-01"
          test "$(git -C source rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(node --version)" = "v${NODE_VERSION}"
          test "$(pnpm --version)" = "${PNPM_VERSION}"
          test "$RUNNER_OS" = "Linux"
          uname -a
          node --version
          pnpm --version

      - name: Create two independent clean source workspaces
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_ARCHIVE="$RUNNER_TEMP/bd-a2-source.tar"
          tar \
            --exclude=.git \
            --exclude=node_modules \
            --exclude=dist \
            --exclude=release-dist \
            --exclude=.astro \
            --sort=name \
            --mtime='@0' \
            --owner=0 \
            --group=0 \
            --numeric-owner \
            -C "$GITHUB_WORKSPACE/source" \
            -cf "$SOURCE_ARCHIVE" .
          mkdir -p "$RUNNER_TEMP/build-a" "$RUNNER_TEMP/build-b" "$RUNNER_TEMP/evidence"
          tar -xf "$SOURCE_ARCHIVE" -C "$RUNNER_TEMP/build-a"
          tar -xf "$SOURCE_ARCHIVE" -C "$RUNNER_TEMP/build-b"
          (
            cd "$RUNNER_TEMP/build-a"
            find . -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum
          ) > "$RUNNER_TEMP/evidence/source-a.sha256"
          (
            cd "$RUNNER_TEMP/build-b"
            find . -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum
          ) > "$RUNNER_TEMP/evidence/source-b.sha256"
          diff -u "$RUNNER_TEMP/evidence/source-a.sha256" "$RUNNER_TEMP/evidence/source-b.sha256"
          sha256sum "$RUNNER_TEMP/evidence/source-a.sha256"

      - name: Clean install and validate Build A
        shell: bash
        working-directory: ${{ runner.temp }}/build-a/07_Website
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile --store-dir "$RUNNER_TEMP/pnpm-store-a"
          pnpm audit --audit-level low
          node --input-type=module -e "import sharp from 'sharp'; console.log(JSON.stringify(sharp.versions, null, 2))" > "$RUNNER_TEMP/evidence/sharp-a.json"
          node ../ci-tools/prepare-ui08-baseline-fixture.mjs
          mkdir -p ../manifests
          pnpm build:release-candidate
          node --experimental-strip-types --test tests/a2-release.test.ts
          node ../ci-tools/check-a2-reachability.mjs \
            --site ../release-dist \
            --inventory ../ci-tools/a2-reachability-inventory.json \
            --output "$RUNNER_TEMP/evidence/reachability-a.json"
          pnpm list --depth Infinity --json \
            | sed "s#${RUNNER_TEMP}/build-a#BUILD_ROOT#g" \
            > "$RUNNER_TEMP/evidence/dependencies-a.json"

      - name: Clean install and validate Build B
        shell: bash
        working-directory: ${{ runner.temp }}/build-b/07_Website
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile --store-dir "$RUNNER_TEMP/pnpm-store-b"
          node --input-type=module -e "import sharp from 'sharp'; console.log(JSON.stringify(sharp.versions, null, 2))" > "$RUNNER_TEMP/evidence/sharp-b.json"
          node ../ci-tools/prepare-ui08-baseline-fixture.mjs
          mkdir -p ../manifests
          pnpm build:release-candidate
          node --experimental-strip-types --test tests/a2-release.test.ts
          node ../ci-tools/check-a2-reachability.mjs \
            --site ../release-dist \
            --inventory ../ci-tools/a2-reachability-inventory.json \
            --output "$RUNNER_TEMP/evidence/reachability-b.json"
          pnpm list --depth Infinity --json \
            | sed "s#${RUNNER_TEMP}/build-b#BUILD_ROOT#g" \
            > "$RUNNER_TEMP/evidence/dependencies-b.json"

      - name: Verify identical dependency and native-image resolution
        shell: bash
        run: |
          set -euo pipefail
          diff -u "$RUNNER_TEMP/evidence/sharp-a.json" "$RUNNER_TEMP/evidence/sharp-b.json"
          diff -u "$RUNNER_TEMP/evidence/dependencies-a.json" "$RUNNER_TEMP/evidence/dependencies-b.json"
          diff -u "$RUNNER_TEMP/evidence/reachability-a.json" "$RUNNER_TEMP/evidence/reachability-b.json"

      - name: Strictly compare complete Build A and Build B artifacts
        shell: bash
        run: |
          set -euo pipefail
          ARTIFACT_A="$RUNNER_TEMP/build-a/release-dist"
          ARTIFACT_B="$RUNNER_TEMP/build-b/release-dist"
          test -d "$ARTIFACT_A"
          test -d "$ARTIFACT_B"
          (
            cd "$ARTIFACT_A"
            find . -type f -printf '%P\n' | LC_ALL=C sort
          ) > "$RUNNER_TEMP/evidence/files-a.txt"
          (
            cd "$ARTIFACT_B"
            find . -type f -printf '%P\n' | LC_ALL=C sort
          ) > "$RUNNER_TEMP/evidence/files-b.txt"
          diff -u "$RUNNER_TEMP/evidence/files-a.txt" "$RUNNER_TEMP/evidence/files-b.txt"
          (
            cd "$ARTIFACT_A"
            find . -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum
          ) > "$RUNNER_TEMP/evidence/build-a.sha256"
          (
            cd "$ARTIFACT_B"
            find . -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum
          ) > "$RUNNER_TEMP/evidence/build-b.sha256"
          diff -u "$RUNNER_TEMP/evidence/build-a.sha256" "$RUNNER_TEMP/evidence/build-b.sha256"

          FILES="$(wc -l < "$RUNNER_TEMP/evidence/files-a.txt" | tr -d ' ')"
          HTML="$(find "$ARTIFACT_A" -type f -name '*.html' | wc -l | tr -d ' ')"
          AUDIO="$(find "$ARTIFACT_A/a2-expanded-audio" -type f -iname '*.mp3' | wc -l | tr -d ' ')"
          SITEMAP="$(grep -o '<loc>' "$ARTIFACT_A/sitemap-0.xml" | wc -l | tr -d ' ')"
          test "$FILES" = "3053"
          test "$HTML" = "240"
          test "$AUDIO" = "59"
          test "$SITEMAP" = "238"
          test ! -e "$ARTIFACT_A/a2/audio-review/index.html"
          test ! -e "$ARTIFACT_A/a2/review-index/index.html"
          node -e "const r=require(process.env.RUNNER_TEMP+'/evidence/reachability-a.json');if(r.status!=='PASS'||r.reachableRecords!==885||r.unreachableRecords!==0)process.exit(1)"

          MANIFEST_SHA="$(sha256sum "$RUNNER_TEMP/evidence/build-a.sha256" | cut -d' ' -f1)"
          printf '{"status":"PASS","sourceCommit":"%s","runnerOS":"%s","node":"%s","pnpm":"%s","files":%s,"htmlPages":%s,"sitemapEntries":%s,"audioAssets":%s,"manifestSha256":"%s","exactPathAndHashEquality":true}\n' \
            "$GITHUB_SHA" "$RUNNER_OS" "$(node --version)" "$(pnpm --version)" "$FILES" "$HTML" "$SITEMAP" "$AUDIO" "$MANIFEST_SHA" \
            | tee "$RUNNER_TEMP/evidence/STRICT_TWO_BUILD_COMPARISON.json"

          {
            echo '## Canonical Linux reproducibility'
            echo
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Toolchain: \`$RUNNER_OS / $(node --version) / pnpm $(pnpm --version)\`"
            echo "- Files: \`$FILES\`"
            echo "- Public HTML: \`$HTML\`"
            echo "- Sitemap entries: \`$SITEMAP\`"
            echo "- Audio assets: \`$AUDIO\`"
            echo '- Approved A2 records reachable: `885/885`'
            echo "- Canonical manifest SHA-256: \`$MANIFEST_SHA\`"
            echo '- Build A vs Build B: **exact path and SHA-256 equality PASS**'
          } >> "$GITHUB_STEP_SUMMARY"

          # Preserve the complete canonical checksum list in the non-deployment job log.
          echo 'BEGIN_CANONICAL_ARTIFACT_SHA256_MANIFEST'
          cat "$RUNNER_TEMP/evidence/build-a.sha256"
          echo 'END_CANONICAL_ARTIFACT_SHA256_MANIFEST'

      - name: Browser-validate learner journeys, media and all-unit navigation
        shell: bash
        run: |
          set -euo pipefail
          ARTIFACT_A="$RUNNER_TEMP/build-a/release-dist"
          SERVER_HOST="127.0.0.1"
          SERVER_PORT="4173"
          CDP_HOST="127.0.0.1"
          CDP_PORT="9222"
          SERVER_LOG="$RUNNER_TEMP/evidence/http-server.log"
          CHROME_LOG="$RUNNER_TEMP/evidence/chrome.log"
          SERVER_PID=""
          CHROME_PID=""

          cleanup() {
            if [ -n "$CHROME_PID" ]; then kill "$CHROME_PID" 2>/dev/null || true; fi
            if [ -n "$SERVER_PID" ]; then kill "$SERVER_PID" 2>/dev/null || true; fi
          }
          diagnostics() {
            echo '--- browser harness diagnostics ---'
            if [ -n "$SERVER_PID" ]; then ps -p "$SERVER_PID" -o pid=,stat=,cmd= || true; fi
            if [ -n "$CHROME_PID" ]; then ps -p "$CHROME_PID" -o pid=,stat=,cmd= || true; fi
            echo '--- http-server.log ---'
            test -f "$SERVER_LOG" && cat "$SERVER_LOG" || true
            echo '--- chrome.log ---'
            test -f "$CHROME_LOG" && cat "$CHROME_LOG" || true
            echo '--- end diagnostics ---'
          }
          finish() {
            status=$?
            trap - EXIT
            if [ "$status" -ne 0 ]; then diagnostics; fi
            cleanup
            exit "$status"
          }
          trap finish EXIT

          test -d "$ARTIFACT_A"
          CHROME_BIN=""
          for candidate in google-chrome google-chrome-stable chromium chromium-browser; do
            if command -v "$candidate" >/dev/null 2>&1; then
              CHROME_BIN="$(command -v "$candidate")"
              break
            fi
          done
          test -n "$CHROME_BIN"
          echo "Chrome binary: $CHROME_BIN"

          python3 -m http.server "$SERVER_PORT" \
            --bind "$SERVER_HOST" \
            --directory "$ARTIFACT_A" \
            > "$SERVER_LOG" 2>&1 &
          SERVER_PID=$!
          SERVER_READY=0
          for attempt in $(seq 1 60); do
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              echo 'Static server exited before becoming ready.' >&2
              exit 1
            fi
            if curl --noproxy '*' --ipv4 --fail --silent --show-error --max-time 2 \
              "http://${SERVER_HOST}:${SERVER_PORT}/a2/" > /dev/null; then
              SERVER_READY=1
              break
            fi
            sleep 0.25
          done
          if [ "$SERVER_READY" -ne 1 ]; then
            echo 'Static server readiness timed out.' >&2
            exit 1
          fi
          echo "Static server ready: http://${SERVER_HOST}:${SERVER_PORT}/a2/"

          "$CHROME_BIN" \
            --headless \
            --no-sandbox \
            --disable-gpu \
            --disable-dev-shm-usage \
            --no-first-run \
            --no-default-browser-check \
            --autoplay-policy=no-user-gesture-required \
            --remote-allow-origins='*' \
            --remote-debugging-address="$CDP_HOST" \
            --remote-debugging-port="$CDP_PORT" \
            --user-data-dir="$RUNNER_TEMP/chrome-a" \
            about:blank > "$CHROME_LOG" 2>&1 &
          CHROME_PID=$!
          CDP_READY=0
          for attempt in $(seq 1 120); do
            if ! kill -0 "$CHROME_PID" 2>/dev/null; then
              echo 'Chrome exited before the DevTools endpoint became ready.' >&2
              exit 1
            fi
            if curl --noproxy '*' --ipv4 --fail --silent --show-error --max-time 2 \
              "http://${CDP_HOST}:${CDP_PORT}/json/version" \
              > "$RUNNER_TEMP/evidence/cdp-version.json"; then
              CDP_READY=1
              break
            fi
            sleep 0.25
          done
          if [ "$CDP_READY" -ne 1 ]; then
            echo 'Chrome DevTools readiness timed out.' >&2
            exit 1
          fi
          echo "Chrome DevTools ready: http://${CDP_HOST}:${CDP_PORT}/json/version"
          cat "$RUNNER_TEMP/evidence/cdp-version.json"

          node source/ci-tools/check-a2-browser-reachability.mjs \
            --site "http://${SERVER_HOST}:${SERVER_PORT}" \
            --browser "http://${CDP_HOST}:${CDP_PORT}" \
            --output "$RUNNER_TEMP/evidence/browser-reachability.json"
          node -e "const r=require(process.env.RUNNER_TEMP+'/evidence/browser-reachability.json');if(r.status!=='PASS'||r.failed!==0)process.exit(1)"
          {
            echo '## Browser learner validation'
            echo
            echo '- Browser harness readiness: **PASS**'
            echo '- Learner navigation, languages, RTL, mobile, exercises and media: **PASS**'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Confirm the job contains no deployment stage
        shell: bash
        run: |
          set -euo pipefail
          echo 'Review-only build and validation complete. No artifact upload, Pages deployment, release, tag, merge, or hosting action was invoked.'
